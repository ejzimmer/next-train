# Translink publishes a new timetable most weeks, with new trip ids, so the Brisbane data is rebuilt every week
# and committed, which redeploys the site. Translink's feeds need no key.
name: Brisbane timetable

on:
  schedule:
    - cron: "0 18 * * 0" # Monday 4am in Brisbane
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gtfs:brisbane
      - name: Commit
        run: |
          git add data/brisbane
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Brisbane timetable"
          git push
