# PTV's tram timetable gets new trip ids when it changes, so Melbourne's tram data is rebuilt every week and
# committed, which redeploys the site. The GTFS download needs no key.
name: Tram timetable

on:
  schedule:
    - cron: "0 17 * * 0" # Monday 4am in Melbourne (3am in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gtfs:trams
        env:
          # stop_times.txt for trams is about 400 MB.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Commit
        run: |
          git add data/trams
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tram timetable"
          git push
