# Sydney Trains' timetable only runs about a month ahead and its trip ids change with each version, so the
# Sydney data is rebuilt every week and committed, which redeploys the site.
name: Sydney timetable

on:
  schedule:
    - cron: "0 17 * * 0" # Monday 3–4am in Sydney
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gtfs:sydney
        env:
          TFNSW_OPENDATA_KEY: ${{ secrets.TFNSW_OPENDATA_KEY }}
      - name: Commit
        run: |
          git add data/sydney
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Sydney timetable"
          git push
