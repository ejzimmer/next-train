# PTV gives Metro trains new trip ids when the timetable changes. A trip the data doesn't know gets its
# destination guessed from the feed's last predicted stop, which can be wrong, so Melbourne's train data is
# rebuilt every day and committed when it changes, which redeploys the site. The GTFS download needs no key.
name: Melbourne train timetable

on:
  schedule:
    - cron: "30 16 * * *" # 3:30am in Melbourne (2:30am in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gtfs:melbourne
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Commit
        run: |
          git add data/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Melbourne train timetable"
          git push
